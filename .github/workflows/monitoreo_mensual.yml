name: Monitoreo mensual

# Corre el sistema con los datos de ejemplo del repositorio el día 1 de cada mes
# y también a pedido. Deja el reporte HTML y el CSV de alertas como artefactos.
on:
  schedule:
    - cron: "0 14 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitoreo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python src/ejecutar_todo.py
      - run: python src/resumen_github.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: monitoreo-${{ github.run_id }}
          path: |
            resultados/reporte_mensual.html
            resultados/alertas.csv
            resultados/monitoreo_resumen.csv
          retention-days: 90
